services:
  postgres:
    image: postgres:18
    container_name: moji-stroski-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stroski
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
